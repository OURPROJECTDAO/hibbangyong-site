/* ── D2 · 앱 src/app/story.tsx StyleSheet 그대로(놀이 판·답 표시·다시 듣기·해석 칩·쪽지·끝 카드 점수) ── */

/* ── 🏢생존 테스트(/office/) — 요일 카드 · 결과지(컷 · 요일 칸 다섯 · 오늘 표현 · 맞는 말) · 알림 ── */
.day-card { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--text); color: var(--rival); border-radius: 14px; padding: 8px 18px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-title); pointer-events: none; animation: day-card 1.6s ease forwards; }
@keyframes day-card { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
.o-card { max-width: 380px; padding: 0 0 16px; overflow: hidden; }
