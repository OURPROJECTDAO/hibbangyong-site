<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="story-base" content="../"><title>인턴 첫날</title><link rel="preload" as="image" href="../art/ep10-intern/meeting.webp" fetchpriority="high"><style>:root{--bg:#FBF7E3;--text:#4a3624;--text2:#6B6455;--el:#FFFFF6;--sel:#F3ECD2;--grip:#E6DCC3;--teal:#1D495D;--rival:#E8A33A;--sweat:#BFE3F5;--sweatRim:#6FAFD3;--disabled:#A89F8C;--onPrimary:#FFFFF6;--primary:#1D495D;--ok:#1d9e75;--hard:#D9874A;--disabledBg:#EFE9DD;--apricot:#F6DFC2;--apricotInk:#B5651D;--wood:#CAA25F;--tealPale:#E3F1F5;--storyLine:#EFE6CC;--storyDim:#8A7560;--scrim:rgba(20,14,8,0.5);--pastEdge:#E2C18E;--fs-small:11px;--lh-small:17px;--fs-body:13px;--lh-body:20px;--fs-read:15px;--lh-read:23px;--fs-lead:19px;--lh-lead:29px;--fs-title:24px;--lh-title:36px}/* 📖 웹 책장 — 앱 src/app/story.tsx StyleSheet 를 옮긴 것(수 = 앱 그대로 · 색 = theme 토큰 CSS 변수) */
@font-face { font-family: 'Jua'; src: url(../fonts/jua.woff) format('woff'); font-display: swap; }
@font-face { font-family: 'Fredoka'; src: url(../fonts/fredoka.woff2) format('woff2'); font-weight: 600; font-display: swap; }
@font-face { font-family: 'Pretendard'; src: url(../fonts/pretendard.woff) format('woff'); font-display: swap; }
@font-face { font-family: 'PretendardBold'; src: url(../fonts/pretendard-bold.woff) format('woff'); font-display: swap; }
/* 📺화면 컷(앱 부품 = react-native-web)은 앱 글꼴 이름(theme Fonts)을 그대로 부른다 → 같은 파일에 이름 하나 더 */
@font-face { font-family: 'Jua_400Regular'; src: url(../fonts/jua.woff) format('woff'); font-display: swap; }
@font-face { font-family: 'Fredoka_600SemiBold'; src: url(../fonts/fredoka.woff2) format('woff2'); font-display: swap; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none; }
body { font-family: 'Jua', system-ui, sans-serif; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; max-width: 480px; margin: 0 auto; padding-bottom: env(safe-area-inset-bottom); }
.play { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.play[hidden], .end-wrap[hidden] { display: none; }
.top { display: flex; align-items: center; gap: 10px; padding: 4px 8px 0 16px; min-height: 44px; }
.top-title { flex: 1; font-size: var(--fs-lead); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-body); color: var(--text2); }
.x { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text2); text-decoration: none; font-size: 20px; }
.bar { height: 4px; margin: 0 14px; border-radius: 2px; background: var(--grip); overflow: hidden; }
.bar-in { height: 4px; background: var(--teal); width: 0; }

.stage { position: relative; flex: 1; margin: 12px 12px 0; border-radius: 18px; overflow: hidden; background: var(--grip); cursor: pointer; }
.cam, .over, .fill { position: absolute; inset: 0; }
.cam { transform-origin: 50% 50%; }
.abs { position: absolute; }
img.cover { width: 100%; height: 100%; object-fit: cover; }
img.contain, .fill.contain { object-fit: contain; }
img.fill { width: 100%; height: 100%; }
.off { opacity: 0; }
.face { will-change: transform; }
.seat-clip { left: 0; top: 0; right: 0; overflow: hidden; }
.drain { background: var(--teal); opacity: 0; pointer-events: none; }
.sweat { position: absolute; top: 12%; right: 14%; background: var(--sweat); border: 1px solid var(--sweatRim); border-top-left-radius: 0 !important; transform: rotate(45deg); animation: sweat 1.6s linear infinite; }
@keyframes sweat { 0% { opacity: 0; transform: translateY(0) rotate(45deg); } 20% { opacity: .95; } 100% { opacity: 0; transform: translateY(10px) rotate(45deg); } }
.clock { position: absolute; top: 10px; right: 10px; background: var(--text); border-radius: 8px; padding: 3px 8px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-read); color: var(--rival); }
.mini { position: absolute; left: 8px; top: 8px; width: 54px; height: 54px; object-fit: contain; }

.chat { border-radius: 16px; overflow: hidden; background: var(--sel); box-shadow: 0 4px 10px rgba(74,54,36,.25); display: flex; flex-direction: column; }
.chat-hd { height: 22px; background: var(--text); flex: none; }
.chat-bd { padding: 10px; display: flex; flex-direction: column; gap: 7px; justify-content: flex-end; }
.msg { max-width: 86%; border-radius: 12px; padding: 7px 10px; }
.msg.me { align-self: flex-end; background: var(--sweat); border-bottom-right-radius: 4px; }
.msg.them { align-self: flex-start; background: var(--el); border-bottom-left-radius: 4px; }
.msg-who { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-small); color: var(--text2); margin-bottom: 2px; }
.msg-txt { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-read); line-height: var(--lh-read); }
.card { background: var(--el); border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 10px rgba(74,54,36,.25); }
.card.hero { border: 4px solid var(--rival); }
.card-img { width: 100%; aspect-ratio: 1.7; border-radius: 10px; margin-bottom: 6px; object-fit: cover; }
.card-lb { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-small); color: var(--text2); }
.card-big { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-lead); }
.card-ln { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-body); line-height: var(--lh-body); }

.bubble { position: relative; margin: 10px 12px 0; background: var(--el); border-radius: 18px; box-shadow: 0 2px 8px rgba(74,54,36,.12); padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; }

.en { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-lead); line-height: var(--lh-lead); white-space: pre-wrap; }   /* RN 글 = 빈칸 안 접힘(빈칸 점선 앞 두 칸) */
.en .key { color: var(--teal); text-decoration: underline; }
.sub { font-size: var(--fs-body); line-height: var(--lh-body); color: var(--text2); }
.ghost { color: rgba(255,255,246,0.004) !important; text-decoration: none !important; }
.gloss-room { height: 24px; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 12px 22px; }
.nav-btn { background: none; border: 0; font: inherit; font-size: var(--fs-body); line-height: 16px; color: var(--teal); padding: 0; cursor: pointer; }
.nav-btn.off { opacity: .35; }
.hint { font-size: var(--fs-small); line-height: 16px; color: var(--disabled); }

.intro { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; padding: 120px 18px 44px; }
.intro-dim { background: rgba(20,14,8,0.5); }
.intro-card { position: relative; width: 100%; max-width: 440px; background: var(--el); border-radius: 24px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.intro-title { font-size: var(--fs-title); }
.intro-box { background: var(--sel); border-radius: 14px; padding: 10px; }

.intro-go { height: 54px; border-radius: 18px; border: 0; background: var(--primary); color: var(--onPrimary); font: inherit; font-size: var(--fs-lead); cursor: pointer; }

.end-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 16px; overflow: auto; }   /* 🩸D3 아이폰 375×664 = 가운데 맞춤이 넘치면 위가 잘려 못 올림 → 카드 margin auto(남으면 가운데 · 넘치면 위부터 스크롤 = 앱 ScrollView 와 같음) */
.end-card { margin: auto; flex: none; width: 100%; max-width: 340px; background: var(--el); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.end-pic { width: 120px; height: 120px; object-fit: contain; }
.end-kick { font-size: var(--fs-body); color: var(--text2); }
.end-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-title); }
.outro { display: flex; align-items: center; gap: 8px; align-self: stretch; background: var(--sel); border-radius: 14px; padding: 10px; }
.outro-face { width: 40px; height: 40px; object-fit: contain; }
.outro-txt { flex: 1; font-size: var(--fs-body); line-height: var(--lh-body); }
.keys { align-self: stretch; display: flex; gap: 8px; }
.key-chip { flex: 1; min-width: 0; border: 2px solid var(--grip); border-radius: 12px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; }
.key-en { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-read); color: var(--teal); }
.key-ko { font-size: var(--fs-small); color: var(--text2); }
.btn { align-self: stretch; min-height: 48px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font: inherit; font-size: var(--fs-read); text-decoration: none; cursor: pointer; border: 0; }
.btn.primary { background: var(--primary); color: var(--onPrimary); }
.btn.secondary { background: var(--sel); color: var(--teal); }
.later { min-height: 44px; display: flex; align-items: center; font-size: var(--fs-body); color: var(--text2); text-decoration: none; }

.shelf { padding: 24px 16px; display: flex; flex-direction: column; gap: 14px; }
.shelf h1 { margin: 0; font-weight: 400; font-size: var(--fs-title); }
.shelf a { display: flex; gap: 12px; align-items: center; background: var(--el); border-radius: 18px; padding: 12px; color: inherit; text-decoration: none; box-shadow: 0 2px 8px rgba(74,54,36,.12); }
.shelf img { width: 72px; height: 96px; object-fit: cover; border-radius: 12px; }
.shelf .t { font-size: var(--fs-lead); }
.shelf .s { font-family: 'Pretendard', system-ui, sans-serif; font-size: var(--fs-body); color: var(--text2); }

/* ── D2 · 앱 src/app/story.tsx StyleSheet 그대로(놀이 판·답 표시·다시 듣기·해석 칩·쪽지·끝 카드 점수) ── */
.nohit { pointer-events: none; }
.board-host { position: absolute; inset: 0; pointer-events: none; }
.board-host > * { pointer-events: auto; }
button { font: inherit; color: inherit; -webkit-appearance: none; appearance: none; }
.mute { display: flex; align-items: center; justify-content: center; background: rgba(255,253,247,0.92); border: 0; border-radius: 14px; padding: 5px 9px; cursor: pointer; }   /* 앱 SoundControl btn */
.mute-art { width: 17px; height: 17px; object-fit: contain; }
.bub-wrap { position: relative; }
.bubble.nohit { cursor: default; pointer-events: auto; }
.en-fx { position: relative; }
.tapword { cursor: pointer; }
.past-edge { border-radius: 18px; border: 6px solid var(--pastEdge); pointer-events: none; }

.opts { position: absolute; left: 8px; right: 8px; display: flex; flex-direction: row; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tray { background: var(--bg); border-radius: 16px; padding: 10px 8px; }
.opt { position: relative; display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--el); box-shadow: 0 2px 6px rgba(74,54,36,.2); cursor: pointer; text-align: left; }
.opt:disabled { cursor: default; }
.opt-ok { background: var(--ok); }
.opt-ok .opt-txt, .opt-ok .opt-ko { color: var(--onPrimary); }
.opt-no { background: var(--disabledBg); }
.opt-txt { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-read); color: var(--text); }
.opt-ko { font-family: 'Jua', sans-serif; font-size: var(--fs-body); line-height: var(--lh-body); color: var(--text); }
.opts-col { position: absolute; left: 10px; right: 10px; display: flex; flex-direction: column; gap: 6px; }
.opts-col .opt { justify-content: flex-start; }
.opt.replay { align-self: flex-end; padding: 6px 12px; font-family: 'Jua', sans-serif; font-size: var(--fs-body); color: var(--teal); }
.opt-in { border: 1.5px solid var(--storyLine); box-shadow: none; justify-content: flex-start; }
.bub-ask { display: flex; flex-direction: column; gap: 6px; }
.glow { position: absolute; inset: 0; border-radius: 12px; border: 3px solid var(--rival); opacity: 0; pointer-events: none; }
.play-ask { align-self: stretch; width: 100%; display: flex; flex-direction: row; align-items: flex-start; gap: 8px; padding: 2px 4px 0; margin-bottom: 6px; }
.play-ask-q { min-width: 22px; height: 22px; border-radius: 6px; padding: 0 5px; background: var(--teal); display: flex; align-items: center; justify-content: center; color: var(--onPrimary); font-size: var(--fs-small); margin-top: calc((var(--lh-body) - 22px) / 2); }
.play-ask-txt { flex: 1; font-family: 'PretendardBold', 'Pretendard', sans-serif; font-weight: 700; font-size: var(--fs-body); line-height: var(--lh-body); color: var(--teal); }
.radio-list { flex-direction: column; flex-wrap: nowrap; align-items: stretch; left: 40px; right: 40px; padding: 8px; gap: 6px; border-radius: 18px; background: var(--bg); }
.radio-row { justify-content: flex-start; gap: 12px; }
.pick { width: 20px; height: 20px; border-radius: 10px; border: 2px solid var(--text2); background: var(--el); display: flex; align-items: center; justify-content: center; flex: none; }
.pick.on { border-color: var(--teal); background: var(--teal); }
.pick.pick-ok { border-color: var(--onPrimary); background: var(--ok); }
.pick-check { width: 9px; height: 5px; border-left: 2px solid var(--onPrimary); border-bottom: 2px solid var(--onPrimary); transform: translateY(-1px) rotate(-45deg); }
.block { background: var(--apricot); border: 2px solid var(--wood); border-bottom-width: 5px; border-radius: 8px; }
.block-used { background: var(--disabledBg); border-color: var(--grip); border-bottom-width: 2px; }
.block-txt { color: var(--apricotInk); }
.opt-used { color: var(--disabled); }
.slots { display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; }
.slot-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.slot { min-width: 44px; min-height: calc(var(--lh-read) + 10px); display: flex; align-items: center; justify-content: center; padding: 4px 8px; border-radius: 10px; border: 2px solid var(--teal); background: var(--sel); }
.slot.block { border-color: var(--wood); background: var(--apricot); border-bottom-width: 5px; border-radius: 8px; cursor: pointer; }
.slot-empty { border-color: var(--grip); background: var(--bg); }
.slot-txt { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-read); line-height: var(--lh-read); color: var(--text); }
.slot-no { font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text2); }
.blank-glue { display: inline-flex; align-items: center; }
.blank-box { display: inline-block; width: 84px; height: calc(var(--lh-read) - 6px); border: 2px dashed var(--teal); border-radius: 8px; background: var(--tealPale); transform: translateY(4px); }
.blank-box.ghost-box { border-color: transparent; background: transparent; }
.en .blank { color: var(--teal); text-decoration: none; }
.steps { display: flex; flex-direction: row; gap: 6px; align-self: flex-start; }
.step { display: flex; align-items: center; gap: 4px; border-radius: 10px; padding: 3px 9px; background: var(--grip); font-family: 'PretendardBold', 'Pretendard', sans-serif; font-weight: 700; font-size: var(--fs-small); color: var(--teal); }
.step.done { background: var(--tealPale); }
.step.on { background: var(--teal); color: var(--onPrimary); }
.answer-mark { position: absolute; inset: 0; border-radius: 18px; border: 1.5px solid; pointer-events: none; }
.am-chip { position: absolute; top: -12.75px; left: 16px; height: 24px; border-radius: 12px; border: 1.5px solid; background: var(--el); display: flex; align-items: center; padding: 0 2px; gap: 5px; }
.am-seal { width: 18px; height: 18px; border-radius: 9px; display: flex; align-items: center; justify-content: center; }
.again { position: absolute; top: 2px; right: 20px; min-height: 44px; display: flex; align-items: center; gap: 6px; }
.gloss { position: absolute; bottom: 2px; right: 20px; min-height: 44px; display: flex; align-items: center; gap: 6px; }
.gloss[hidden] { display: none; }
.again-btn { padding: 3px 10px; border: 0; border-radius: 10px; background: var(--sel); font-family: 'Jua', sans-serif; font-size: var(--fs-small); color: var(--teal); cursor: pointer; line-height: normal; }
.ko-auto { display: flex; align-items: center; gap: 5px; }
.ko-box { width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--teal); }
.ko-box.on { background: var(--teal); }
.ko-auto.dim { color: var(--storyDim); }
.ko-auto.dim .ko-box { border-color: var(--storyDim); }
.help-q { width: 44px; height: 44px; margin-left: 2px; display: flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; cursor: pointer; }
.help-art { width: 18px; height: 18px; object-fit: contain; }
.hint.on { font-family: 'PretendardBold', 'Pretendard', sans-serif; font-weight: 700; color: var(--text); }

.sheet-host { position: fixed; inset: 0; pointer-events: none; z-index: 40; }
.sheet-back { position: absolute; inset: 0; background: var(--scrim); pointer-events: auto; }
.sheet { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: calc(100% - 32px); max-width: 340px; background: var(--el); border: 1px solid var(--grip); border-radius: 20px; padding: 16px; display: flex; flex-direction: column; gap: 8px; align-items: center; box-shadow: 0 6px 16px rgba(74,54,36,.18); pointer-events: auto; }
.sheet-en { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-title); color: var(--text); }
.sheet-ko { font-size: var(--fs-lead); color: var(--text2); }
.sheet-title { align-self: stretch; font-family: 'PretendardBold', 'Pretendard', sans-serif; font-weight: 800; font-size: var(--fs-title); line-height: var(--lh-title); }
.help-lead { align-self: stretch; font-family: 'PretendardBold', 'Pretendard', sans-serif; font-weight: 800; font-size: var(--fs-read); line-height: var(--lh-read); color: var(--teal); }
.help-row { align-self: stretch; display: flex; gap: 8px; align-items: flex-start; font-family: 'Pretendard', sans-serif; font-size: var(--fs-read); line-height: var(--lh-read); color: var(--text2); }
.help-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--grip); margin-top: calc(var(--lh-read) / 2 - 3px); flex: none; }

.score { align-self: stretch; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.score-txt { font-size: var(--fs-lead); color: var(--text); }
.dots { display: flex; flex-direction: row; gap: 8px; justify-content: center; flex-wrap: wrap; }

.dot-x { font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text2); }
.cart-note { font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text2); }
.keys-hd { align-self: stretch; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cart-title { font-size: var(--fs-body); color: var(--text); }
.lv { font-size: var(--fs-small); color: var(--teal); border: 1px solid var(--grip); border-radius: 8px; padding: 0 6px; }

/* ── 🏢생존 테스트(/office/) — 요일 카드 · 결과지(컷 · 요일 칸 다섯 · 오늘 표현 · 맞는 말) · 알림 ── */
.day-card { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--text); color: var(--rival); border-radius: 14px; padding: 8px 18px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-title); pointer-events: none; animation: day-card 1.6s ease forwards; }
@keyframes day-card { 0% { opacity: 0; } 15% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
.o-card { max-width: 380px; padding: 0 0 16px; overflow: hidden; }
.o-cut { width: 100%; aspect-ratio: 540 / 968; max-height: 52vh; object-fit: cover; object-position: 50% 100%; }   /* 컷 인물 = 아래 끝에 섬(survive_cuts bottom 0.99H) → 아래 기준으로 자름 */
.o-days { display: flex; gap: 6px; justify-content: center; }
.o-day { min-width: 44px; padding: 3px 0; border-radius: 10px; text-align: center; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: var(--fs-small); border: 2px solid var(--grip); color: var(--text2); }
.o-day.ok { border-color: var(--ok); color: var(--ok); }
