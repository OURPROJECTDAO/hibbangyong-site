<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>앱 받기 · 하이빵용</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#FBF7E3;color:#4a3624;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
main{max-width:30rem;margin:0 auto;padding:max(2rem,env(safe-area-inset-top)) 16px 2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;min-height:100vh;min-height:100svh;justify-content:center;text-align:center}
h1{font-size:1.4rem;margin:0}
p{margin:0;color:#6B6455}
button{display:flex;width:100%;max-width:24rem;align-items:center;justify-content:center;min-height:3.25rem;border:0;border-radius:999px;background:#1D495D;color:#fff;font-weight:700;font-size:1.1rem;cursor:pointer}
button[disabled]{opacity:.6}
button[hidden]{display:none}
a{color:#6B6455}
</style>
</head>
<body>
<main>
<h1 id="h">앱 받는 곳으로 가는 중이에요</h1>
<p id="p">잠시 뒤 열려요. 안 열리면 아래 단추를 눌러 주세요.</p>
<div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px 16px;--bh:clamp(40px,12vw,60px)"><a id="ga" href="#" style="display:block;line-height:0;color:#1D495D;font-weight:700"><img src="/img/ko_badge_web_generic.png" alt="Google Play에서 다운로드" width="646" height="250" style="display:block;width:auto;height:calc(var(--bh) / .768)"></a><a id="gi" href="#" style="display:block;line-height:0;color:#1D495D;font-weight:700"><img src="/img/appstore_badge_ko_black.svg" alt="App Store에서 다운로드하기" width="130" height="40" style="display:block;width:auto;height:var(--bh)"></a></div><p id="n" hidden>App Store 에서 «하이빵용»을 찾아도 돼요.</p>
<a href="/">하이빵용</a>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search), s = q.get('s') || '', os = q.get('os') || '';
  var ua = navigator.userAgent || '', tp = navigator.maxTouchPoints || 0;
  if (!os) os = /Android/i.test(ua) ? 'android' : (/iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && tp > 1)) ? 'ios' : '';
  var U = {"android": {"notice": "https://play.google.com/store/apps/details?id=com.ourprojectdao.kidsenglishapp&referrer=utm_source%3Demail%26utm_medium%3Dnotice%26utm_campaign%3Dapp", "d0": "https://play.google.com/store/apps/details?id=com.ourprojectdao.kidsenglishapp&referrer=utm_source%3Demail%26utm_medium%3Dd0%26utm_campaign%3Dapp"}, "ios": "https://apps.apple.com/kr/app/id6817568088"}, P = ["앱 받기", "쓰시는 폰에 맞는 단추를 눌러 주세요."], n = document.getElementById('n');
  var ms = /^(notice|d0)$/.test(s) ? s : 'notice';
  var a = document.getElementById('ga'), i = document.getElementById('gi');
  a.href = U.android[ms]; i.href = U.ios; n.hidden = false;
  if (!/^(android|ios)$/.test(os) || !/^(notice|d0)$/.test(s)) { document.getElementById('h').textContent = P[0]; document.getElementById('p').textContent = P[1]; return; }   // PC·그 밖·꼴 밖 = 두 단추만(넘기지 않음 · «가는 중» 글 0)
  if (os === 'ios') i.parentNode.insertBefore(i, a); else n.hidden = true;
  var to = os === 'ios' ? U.ios : U.android[s], gone = false;
  var go = function () { if (gone) return; gone = true; location.replace(to); };
  var f = document.createElement('iframe');
  f.hidden = true; f.setAttribute('aria-hidden', 'true'); f.src = '/c/m/' + os + '/' + s + '/';
  f.onload = function () { setTimeout(go, 300); };
  document.body.appendChild(f);
  setTimeout(go, 1500);
})();
</script>
</body>
</html>
