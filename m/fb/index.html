<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>편지 의견 · 하이빵용</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#FBF7E3;color:#4a3624;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
main{max-width:30rem;margin:0 auto;padding:max(2rem,env(safe-area-inset-top)) 16px 2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;min-height:100vh;min-height:100svh;justify-content:center;text-align:center}
h1{font-size:1.4rem;margin:0}
p{margin:0;color:#6B6455}
button{display:flex;width:100%;max-width:24rem;align-items:center;justify-content:center;min-height:3.25rem;border:0;border-radius:999px;background:#1D495D;color:#fff;font-weight:700;font-size:1.1rem;cursor:pointer}
button[disabled]{opacity:.6}
button[hidden]{display:none}
a{color:#6B6455}
</style>
</head>
<body>
<main>
<h1 id="h">오늘 편지 의견</h1>
<p id="p">메일의 의견 단추를 다시 눌러 주세요.</p>
<button id="b" type="button" hidden></button>
<a href="/">하이빵용</a>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var i = q.get('i') || '', f = q.get('f') || '', t = q.get('t') || '';
  var b = document.getElementById('b'), h = document.getElementById('h'), p = document.getElementById('p');
  var A = {"good": ["오늘 편지가 좋으셨나요?", "아래 단추를 누르시면 «좋았어요»로 전해져요. 누가 보냈는지는 남지 않아요.", "좋았어요 보내기"], "meh": ["아쉬운 점이 있으셨나요?", "아래 단추를 누르시면 «아쉬워요»로 전해져요. 자세한 의견은 help@hibbangyong.com 으로 보내 주셔도 돼요.", "아쉬워요 보내기"]}, D = {"ok": ["전해 주셔서 고마워요", "다음 편지를 만들 때 꼭 참고할게요."], "invalid": ["링크를 확인할 수 없어요", "메일의 의견 단추를 다시 눌러 주세요."], "error": ["잠시 뒤 다시 눌러 주세요", "지금은 처리할 수 없어요."]};
  if (!/^(d0|L[1-9]-(0[1-9]|1[0-2]))$/.test(i) || !A[f]) { b.hidden = true; h.textContent = D.invalid[0]; p.textContent = D.invalid[1]; return; }
  h.textContent = A[f][0]; p.textContent = A[f][1]; b.textContent = A[f][2]; b.hidden = false;
  b.addEventListener('click', function () {
    b.disabled = true;
    var show = function (k) { var d = D[k] || D.error; h.textContent = d[0]; p.textContent = d[1]; b.hidden = true; };
    fetch("https://nvokkscghiqlohwbujso.supabase.co/functions/v1/trial-mail", { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: "sb_publishable_f4Ax5r5859lJ-JcC_ffJeQ_fDVdiaLv" }, body: JSON.stringify(/^[a-f0-9]{32}$/.test(t) ? { fb: i, f: f, t: t } : { fb: i, f: f }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { show(j && j.r ? j.r : 'error'); })
      ['catch'](function () { b.disabled = false; show('error'); b.hidden = false; });
  });
})();
</script>
</body>
</html>
