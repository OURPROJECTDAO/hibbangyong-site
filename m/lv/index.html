<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>단어 카드 레벨 · 하이빵용</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#FBF7E3;color:#4a3624;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
main{max-width:30rem;margin:0 auto;padding:max(2rem,env(safe-area-inset-top)) 16px 2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;min-height:100vh;min-height:100svh;justify-content:center;text-align:center}
h1{font-size:1.4rem;margin:0}
p{margin:0;color:#6B6455}
button{display:flex;width:100%;max-width:24rem;align-items:center;justify-content:center;min-height:3.25rem;border:0;border-radius:999px;background:#1D495D;color:#fff;font-weight:700;font-size:1.1rem;cursor:pointer}
button[disabled]{opacity:.6}
button[hidden]{display:none}
a{color:#6B6455}
</style>
</head>
<body>
<main>
<h1 id="h">단어 카드 레벨 맞추기</h1>
<p id="p">메일의 레벨 단추를 다시 눌러 주세요.</p>
<button id="b" type="button" hidden></button>
<a href="/">하이빵용</a>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var t = (q.get('t') || '').toLowerCase(), f = q.get('f') || '';
  var b = document.getElementById('b'), h = document.getElementById('h'), p = document.getElementById('p');
  var A = {"easy": ["다음 카드부터 한 단계 어렵게 받을까요?", "아래 단추를 누르셔야 반영돼요. 한 통에 한 번만 바꿀 수 있어요.", "네, 한 단계 올려 주세요"], "ok": ["지금 레벨 그대로 받을까요?", "아래 단추를 누르시면 지금 레벨로 이어서 보내 드려요.", "네, 이대로 받을게요"], "hard": ["다음 카드부터 한 단계 쉽게 받을까요?", "아래 단추를 누르셔야 반영돼요. 한 통에 한 번만 바꿀 수 있어요.", "네, 한 단계 내려 주세요"]}, D = {"ok": ["반영됐어요", "다음 카드는 레벨 {lv} 단어로 보내 드릴게요."], "already": ["이번 통엔 이미 반영됐어요", "다음 카드는 레벨 {lv} 단어로 보내 드려요."], "done": ["카드를 모두 보내 드렸어요", "12통이 다 끝나서 바꿀 카드가 없어요."], "unsub": ["수신거부된 주소예요", "더 보내는 카드가 없어요."], "invalid": ["링크를 확인할 수 없어요", "메일의 레벨 단추를 다시 눌러 주세요."], "error": ["잠시 뒤 다시 눌러 주세요", "지금은 처리할 수 없어요."]};
  if (!/^[a-f0-9]{32}$/.test(t) || !A[f]) { b.hidden = true; h.textContent = D.invalid[0]; p.textContent = D.invalid[1]; return; }
  h.textContent = A[f][0]; p.textContent = A[f][1]; b.textContent = A[f][2]; b.hidden = false;
  b.addEventListener('click', function () {
    b.disabled = true;
    var show = function (k, lv) { var d = D[k] || D.error; h.textContent = d[0]; p.textContent = d[1].replace('{lv}', String(lv || '')); b.hidden = true; };
    fetch("https://nvokkscghiqlohwbujso.supabase.co/functions/v1/trial-mail", { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: "sb_publishable_f4Ax5r5859lJ-JcC_ffJeQ_fDVdiaLv" }, body: JSON.stringify({ lv: t, f: f }) })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) { show(j && j.r ? j.r : 'error', j && j.lv); })
      ['catch'](function () { b.disabled = false; show('error'); b.hidden = false; });
  });
})();
</script>
</body>
</html>
