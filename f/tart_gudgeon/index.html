<style>
*{box-sizing:border-box}
html,body{margin:0;background:#FBF7E3;color:#4a3624;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
main{max-width:30rem;margin:0 auto;padding:max(1.2rem,env(safe-area-inset-top)) 16px 2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;min-height:100vh;min-height:100svh;justify-content:center;text-align:center}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:1.6rem;line-height:1.35;margin:0;text-wrap:balance}
img.card{width:100%;max-width:26rem;height:auto;border-radius:1.4rem;box-shadow:0 10px 30px rgba(90,60,25,.12)}
.size{margin:0;font-weight:700;color:#6B6455}
.size:empty{display:none}
.go{display:flex;width:100%;max-width:24rem;align-items:center;justify-content:center;min-height:3.25rem;border-radius:999px;background:#1D495D;color:#fff;font-weight:700;font-size:1.1rem;text-decoration:none}
.home{color:#6B6455;font-size:.9rem}
</style>

<body>
<main>
<h1>친구가 물 확률 5%의 타르트모래무지를 잡았어요. 너는?</h1>
<img class="card" src="/f/tart_gudgeon/card.png" alt="타르트모래무지 · 물 확률 5%" width="1080" height="1080">
<p id="size" class="size"></p>
<a id="go" class="go" href="/play/">나도 3분 해 보기</a>
<a class="home" href="/">하이빵용</a>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var s = (q.get('s') || '').replace(/[^0-9.]/g, '').slice(0, 5);
  if (s && !isNaN(parseFloat(s))) document.getElementById('size').textContent = '크기 ' + s + 'cm';
  var r = (q.get('r') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 32);
  if (r) document.getElementById('go').href = '/play/?r=' + encodeURIComponent(r);
})();
</script>
</body>
