*{box-sizing:border-box}
html,body{margin:0;background:#FBF7E3;color:#4a3624;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
main{max-width:30rem;margin:0 auto;padding:max(1.2rem,env(safe-area-inset-top)) 16px 2rem;display:flex;flex-direction:column;align-items:center;gap:1rem;min-height:100vh;min-height:100svh;justify-content:center;text-align:center}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:1.6rem;line-height:1.35;margin:0;text-wrap:balance}
img.card{width:100%;max-width:26rem;height:auto;border-radius:1.4rem;box-shadow:0 10px 30px rgba(90,60,25,.12)}

.go{display:flex;width:100%;max-width:24rem;align-items:center;justify-content:center;min-height:3.25rem;border-radius:999px;background:#1D495D;color:#fff;font-weight:700;font-size:1.1rem;text-decoration:none}

<body>
<main>
<h1>친구가 물 확률 6%의 소라빵쉬리를 잡았어요. 너는?</h1>
<img class="card" src="/f/conch_bun_shiri/card.png" alt="소라빵쉬리 · 물 확률 6%" width="1080" height="1080">
<p id="size" class="size"></p>
<p id="times" class="size"></p>
<p class="desc">소라빵처럼 도르르 말린 무늬가 옆줄을 따라 도는 날씬한 몸. 무늬만큼은 빵나라 최고 멋쟁이.</p>
<a id="go" class="go" href="/play/">나도 3분 해 보기</a>
<a class="home" href="/">하이빵용</a>
</main>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var s = (q.get('s') || '').replace(/[^0-9.]/g, '').slice(0, 5);
  var g = (q.get('g') || '').replace(/[^0-9]/g, '').slice(0, 7);
  var tl = (q.get('lt') || '').replace(/[^0-9]/g, '').slice(0, 4), tc = (q.get('ct') || '').replace(/[^0-9]/g, '').slice(0, 4), tt = ["벌목 {n}초", "포획 {n}초"];
  document.getElementById('times').textContent = [tl ? tt[0].replace('{n}', tl) : '', tc ? tt[1].replace('{n}', tc) : ''].filter(Boolean).join(' · ');
  if (s && !isNaN(parseFloat(s))) document.getElementById('size').textContent = "{cm}cm · 최대 {max}cm · 총 가치 {g}골드".replace('{cm}', s).replace('{max}', "10").replace(g ? '{g}' : ' · 총 가치 {g}골드', g);
  var r = (q.get('r') || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 32);
  var via = q.get('via') || '';
  if (["kakao", "share", "qr"].indexOf(via) < 0) via = '';
  var h = q.get('hop') || '';
  var hop = /^[0-9]{1,2}$/.test(h) && +h >= 1 ? +h : 0;
  var go = new URLSearchParams();
  if (via) go.set('via', via);
  if (hop) go.set('hop', String(hop));
  if (r) go.set('r', r);
  if (go.toString()) document.getElementById('go').href = '/play/?' + go.toString();
  if (!hop) return;
  var c = '/c/f/' + (via || 'x') + '/' + Math.min(3, hop) + '/';
  try { if (sessionStorage.getItem('hbb-c' + location.pathname) === c) return; sessionStorage.setItem('hbb-c' + location.pathname, c); } catch (e) {}
  var f = document.createElement('iframe');
  f.src = c; f.hidden = true; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.style.display = 'none';
  document.body.appendChild(f);
})();
</script>
</body>
