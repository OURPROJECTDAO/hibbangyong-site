<script>
(function(){
  var q = new URLSearchParams(location.search);
  var go = new URLSearchParams();

  var rc = (q.get('rec') || '').replace(/[^a-z0-9_.~]/g, '').slice(0, 120);
  if (rc) go.set('rec', rc);
  var pk = q.get('pk') || '';
  if (/^[a-z0-9]{12}$/.test(pk)) go.set('pk', pk);
  document.getElementById('go').href = '/play/?' + go.toString();
  var T = {"label": {"w": "아는 단어", "r": "순발력", "a": "대처력", "l": "운"}, "names": {"w": ["초·중등", "고등", "토플 초입", "토플 상위"], "r": ["신중", "차분", "재빠름", "번개"], "a": ["차근차근", "침착", "척척", "즉시 해결"]}, "bands": ["표지판은 읽음", "메뉴판은 읽음", "입국 서류는 혼자 다 씀", "현지 뉴스 보며 웃음"], "rarity": ["커먼", "언커먼", "레어", "유니크", "에픽", "레전더리"], "sec": "{n}초", "top": "상위 {n}%", "weapon": "가장 센 무기: {label} {stage}", "surv": "해외 생존력", "color": {"w": "#1D495D", "r": "#1d9e75", "a": "#C88A81", "l": "#D2A12A", "track": "#F3ECD2"}};
  /*card*/
  function hbbCard(raw, T) {
    var m = /^([0-9]{1,2})_([1-4])([1-4])([1-4])_([0-5]|-)_([0-9]{1,2}(?:[.][0-9])?|-)_([0-9]{1,4}|-)_([0-9]{1,4}|-)_([0-9]{1,3})-([0-9]{1,3})-([0-9]{1,3})-([0-9]{1,3})-([0-9]{1,3})$/.exec(raw || '');
    if (!m) return null;
    var b = { w: +m[2], r: +m[3], a: +m[4] };
    var sec = function (v) { return v === '-' ? '' : T.sec.replace('{n}', v); };
    var rows = [
      { k: 'w', label: T.label.w, band: b.w, stage: T.names.w[b.w - 1], ev: T.bands[b.w - 1] },
      { k: 'r', label: T.label.r, band: b.r, stage: T.names.r[b.r - 1], ev: sec(m[7]) },
      { k: 'a', label: T.label.a, band: b.a, stage: T.names.a[b.a - 1], ev: sec(m[8]) }
    ];
    if (m[5] !== '-' && T.rarity[+m[5]]) rows.push({ k: 'l', label: T.label.l, band: null, stage: T.rarity[+m[5]] + (m[6] !== '-' ? ' · ' + T.top.replace('{n}', m[6]) : ''), ev: '' });
    var best = ['r', 'a', 'w'].reduce(function (x, k) { return b[k] > b[x] ? k : x; }, 'r');
    var br = rows.filter(function (r) { return r.k === best; })[0];
    return { surv: +m[1], rows: rows, parts: [+m[9], +m[10], +m[11], +m[12], +m[13]], weapon: T.weapon.replace('{label}', br.label).replace('{stage}', br.stage) };
  }
  /*card-end*/
  var cd = hbbCard(q.get('c'), T);
  if (cd) {
    var el = function (tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
    var rgba = function (hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')'; };
    document.getElementById('tc-sl').textContent = T.surv;
    document.getElementById('tc-sn').textContent = cd.surv + '%';
    var bar = document.getElementById('tc-bar'); bar.style.background = T.color.track;
    var segc = ['rgba(107,100,85,0.28)', T.color.w, T.color.r, T.color.a, T.color.l];
    cd.parts.forEach(function (w, i) { if (w > 0) { var s = el('span'); s.style.width = Math.min(w, 100) + '%'; s.style.background = segc[i]; bar.appendChild(s); } });
    var grid = document.getElementById('tc-grid');
    cd.rows.forEach(function (r, i) {
      var c = el('div', 'cell' + (cd.rows.length === 3 && i === 2 ? ' full' : '')); c.style.background = rgba(T.color[r.k], 0.14);
      c.appendChild(el('span', 'lb', r.label)); c.appendChild(el('span', 'st', r.stage));
      var ft = el('span', 'ft');
      if (r.band != null) { var dt = el('span', 'dt'); for (var d = 1; d <= 4; d++) { var i2 = el('i'); i2.style.background = d <= r.band ? T.color[r.k] : 'rgba(107,100,85,0.18)'; dt.appendChild(i2); } ft.appendChild(dt); }
      if (r.ev) ft.appendChild(el('span', 'ev', r.ev));
      c.appendChild(ft); grid.appendChild(c);
    });
    document.getElementById('tc-wp').textContent = cd.weapon;
    document.getElementById('tc').hidden = false;
    document.getElementById('og').hidden = true;
  }
  var ok = 'web', rules = [["kakao", "KAKAOTALK"], ["insta", "Instagram"], ["fb", "FBAN|FBAV|FB_IAB"], ["naver", "NAVER\\(inapp"]];
  for (var i = 0; i < rules.length; i++) { if (new RegExp(rules[i][1], 'i').test(navigator.userAgent || '')) { ok = rules[i][0]; break; } }
  var oc = '/c/o/t/' + (via || 'x') + '/' + ok + '/';
  var seen = false;
  try { seen = sessionStorage.getItem('hbb-o' + location.pathname) === oc; sessionStorage.setItem('hbb-o' + location.pathname, oc); } catch (e) {}
  if (!seen) { var of = document.createElement('iframe'); of.src = oc; of.hidden = true; of.tabIndex = -1; of.setAttribute('aria-hidden', 'true'); of.style.display = 'none'; document.body.appendChild(of); }
  if (!hop) return;
  var c = '/c/t/' + (via || 'x') + '/' + Math.min(3, hop) + '/';
  try { if (sessionStorage.getItem('hbb-c' + location.pathname) === c) return; sessionStorage.setItem('hbb-c' + location.pathname, c); } catch (e) {}
  var f = document.createElement('iframe');
  f.src = c; f.hidden = true; f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.style.display = 'none';
  document.body.appendChild(f);
})();
